<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hold Planner</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0B3D5C">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: sticky command bar, ship side profile as the hero, then a tray/inspector column beside live tables. Neutral steel frame so port colours carry all meaning. */
:root{
  --bg:#F2F4F6; --surface:#FFFFFF; --surface-2:#EBEFF3; --line:#D3DAE1; --line-2:#BCC6D0;
  --fg:#111A22; --muted:#55636F; --primary:#0B3D5C; --primary-fg:#FFFFFF; --primary-soft:#DCE8F0;
  --hull:#2B3A47; --hull-fill:#E3E9EE; --hold-bg:#F7F9FA;
  --good:#1D7A45; --warn:#9A6200; --crit:#B3261E; --good-soft:#DDF1E5; --warn-soft:#FBEFD6; --crit-soft:#F8DEDC;
  --font-ui:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
  --r:8px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D1318; --surface:#151E26; --surface-2:#1B2630; --line:#2A3743; --line-2:#3A4856;
  --fg:#E6EDF3; --muted:#9AAAB8; --primary:#6CB2DC; --primary-fg:#07131B; --primary-soft:#1B3445;
  --hull:#8FA3B5; --hull-fill:#16212A; --hold-bg:#111A21;
  --good:#4CC38A; --warn:#F2C14E; --crit:#FF7A72; --good-soft:#173429; --warn-soft:#3A2F14; --crit-soft:#3D1E1C;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1318; --surface:#151E26; --surface-2:#1B2630; --line:#2A3743; --line-2:#3A4856;
  --fg:#E6EDF3; --muted:#9AAAB8; --primary:#6CB2DC; --primary-fg:#07131B; --primary-soft:#1B3445;
  --hull:#8FA3B5; --hull-fill:#16212A; --hold-bg:#111A21;
  --good:#4CC38A; --warn:#F2C14E; --crit:#FF7A72; --good-soft:#173429; --warn-soft:#3A2F14; --crit-soft:#3D1E1C;
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{color-scheme:light}
body{margin:0}
img{max-width:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--font-ui);font-size:14px;line-height:1.45;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 32px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
.num,td.n,th.n{font-family:var(--font-num);font-variant-numeric:tabular-nums}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.btn{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 12px;border:1px solid var(--line-2);border-radius:var(--r);background:var(--surface);transition:background .15s,border-color .15s}
.btn:hover{background:var(--surface-2)}
.btn:disabled{opacity:.42;cursor:default}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--primary-fg);font-weight:600}
.btn.danger{color:var(--crit);border-color:var(--crit)}
.btn.sm{min-height:30px;padding:0 9px;font-size:13px}
.btn.on{background:var(--primary-soft);border-color:var(--primary)}
.ico{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));background:var(--surface);border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand svg{width:28px;height:28px;flex:none}
.brand b{font-size:16px;letter-spacing:.01em}
.brand small{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:var(--r);overflow:hidden}
.seg button{border:0;background:transparent;min-height:34px;padding:0 12px}
.seg button[aria-pressed="true"]{background:var(--primary);color:var(--primary-fg);font-weight:600}
.top .spacer{flex:1}
.top .grp{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.save{font-size:12px;color:var(--muted)}

main{max-width:1600px;margin:0 auto;display:grid;gap:16px;padding-top:16px;min-width:0}
main>*,#planview>*,.lower>*,.side>*{min-width:0}
.banner{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:10px 14px;border:1px dashed var(--line-2);border-radius:var(--r);background:var(--surface);font-size:13px}
.banner b{font-weight:600}

/* summary */
.summary{display:flex;flex-wrap:wrap;gap:8px 28px;align-items:flex-end}
.kpi .l{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.kpi .v{font-family:var(--font-num);font-size:20px;font-weight:600}
.kpi .v small{font-size:12px;font-weight:400;color:var(--muted)}
.kpi.rem .v{color:var(--warn)}
.kpi.ok .v{color:var(--good)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;border:1px solid transparent;white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.crit{background:var(--crit-soft);color:var(--crit)}
.pill.info{background:var(--surface-2);color:var(--muted)}
.pill .ico{width:13px;height:13px}

/* rotation */
.rot{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center}
.rot .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-right:2px}
.rot .run{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pchip{display:inline-flex;align-items:center;gap:7px;min-height:32px;padding:0 10px 0 6px;border:1px solid var(--line-2);border-radius:999px;background:var(--surface);font-size:13px}
.pchip i{width:16px;height:16px;border-radius:50%;background:var(--c)}
.pchip.lp i{border-radius:3px}
.pchip code{font-family:var(--font-num);font-size:11px;color:var(--muted)}
.pchip[aria-pressed="true"]{border-color:var(--primary);background:var(--primary-soft);font-weight:600}
.arrow{color:var(--muted)}
.tools{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}

/* ship */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.shipcard{padding:12px 0 10px}
.ship-scroll{overflow-x:auto;padding:0 12px 4px}
.ship{position:relative;min-width:1080px;padding:96px 6.5% 0 14%}
.ship svg{overflow:visible}
.ship .ln{fill:none;stroke:var(--hull);stroke-width:1.4;stroke-linejoin:round;stroke-linecap:round}
.ship .fl{fill:var(--hull-fill);stroke:var(--hull);stroke-width:1.4;stroke-linejoin:round}
.ship .thin{fill:none;stroke:var(--hull);stroke-width:1;opacity:.6}
.ship .win{fill:none;stroke:var(--hull);stroke-width:3;stroke-dasharray:4 4;opacity:.55}
.ship .wl{fill:none;stroke:var(--line-2);stroke-width:1;stroke-dasharray:7 6}
.hull{position:absolute;left:0;right:0;top:114px;width:100%;height:240px}
.house{position:absolute;left:.6%;top:4px;width:12.6%;height:110px}
.foremast{position:absolute;right:2.2%;top:46px;width:34px;height:66px}
.endlabel{position:absolute;top:186px;font-size:11px;letter-spacing:.12em;color:var(--muted);font-weight:600}
.endlabel.fwd{right:1.8%}.endlabel.aft{left:2%}
.engine{position:absolute;left:3.5%;top:214px;width:8%;text-align:center;font-size:11px;color:var(--muted)}
.gantry{position:absolute;left:-3px;right:-3px;top:-80px;height:104px;width:calc(100% + 6px);pointer-events:none;z-index:3}
.gantry-tag{position:absolute;top:-98px;left:0;width:calc(200% + 6px);white-space:nowrap;text-align:center;font-size:10px;letter-spacing:.08em;color:var(--muted);pointer-events:none}
.holds{position:relative;display:flex;flex-direction:row-reverse;gap:6px}
.hold{position:relative;flex:1 1 0;min-width:0;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:26px 212px auto;border-radius:6px}
.hold-head{display:flex;align-items:center;justify-content:center;gap:4px;font-weight:700;font-size:13px;border-radius:6px 6px 0 0;color:var(--fg)}
.hold-head .ico{width:14px;height:14px;color:var(--warn)}
.hold-head .ico.crit{color:var(--crit)}
.hold-body{align-self:start;height:calc(206px * var(--d,1));display:flex;flex-direction:column-reverse;border:1.5px solid var(--hull);border-top-style:dashed;background:var(--hold-bg);overflow:hidden;margin-top:6px}
.layer{position:relative;display:flex;min-height:30px;container-type:size;border-top:1px dashed var(--line-2);transition:background .12s,box-shadow .12s}
.layer.free,.layer.fullstack{border-top:0!important}
.layer.empty{flex:0 0 16px!important;min-height:16px;background:repeating-linear-gradient(135deg,transparent 0 5px,var(--surface-2) 5px 7px)}
.layer.free{flex:1 1 auto!important;min-height:16px;align-items:flex-start;justify-content:center;border-top:1px dashed var(--line-2)}
.layer.free span{font-size:10.5px;color:var(--muted);padding-top:4px;opacity:0;transition:opacity .15s}
body.dragging .layer.free span{opacity:1}
.layer.fullstack{flex:1 1 auto!important;min-height:0;border-top:0}
.tier-tag{position:absolute;left:3px;bottom:2px;font-size:9.5px;font-family:var(--font-num);color:var(--muted);pointer-events:none;z-index:1}
.stow{position:relative;flex-basis:0;min-width:14px;display:flex;flex-direction:column;justify-content:center;padding:2px 4px 2px 10px;overflow:hidden;font-size:11px;line-height:1.15;border-right:1px solid rgba(255,255,255,.6);background:linear-gradient(90deg,var(--lp) 0 6px,rgba(255,255,255,.85) 6px 7px,var(--dp) 7px);color:var(--ink);user-select:none;-webkit-user-select:none;touch-action:none;cursor:grab;transition:opacity .15s,filter .15s}
.stow:last-child{border-right:0}
.stow b{font-weight:600;white-space:nowrap}
.stow span{font-family:var(--font-num);white-space:nowrap}
.stow em{font-style:normal;opacity:.85;white-space:nowrap}
@container (max-height:44px){.stow em{display:none}}
@container (max-height:32px){.stow b{display:none}}
.stow.sel{outline:2.5px solid var(--fg);outline-offset:-2.5px;z-index:2}
.stow.locked{cursor:default}
.stow.locked::after{content:"";position:absolute;right:3px;top:3px;width:9px;height:9px;border:2px solid currentColor;border-radius:2px}
.dim{opacity:.18;filter:grayscale(.6)}
.stow.src{opacity:.35}
.layer.t-ok{background:var(--good-soft);box-shadow:inset 0 0 0 2px var(--good)}
.layer.t-warn{background:var(--warn-soft);box-shadow:inset 0 0 0 2px var(--warn)}
.layer.t-block{background:var(--crit-soft);box-shadow:inset 0 0 0 2px var(--crit)}
.hold.t-auto .hold-head,.hold.t-auto .hold-foot{background:var(--primary-soft)}
#tray.t-ok{box-shadow:inset 0 0 0 2px var(--primary)}
.hold-foot{padding:8px 2px 2px;text-align:center;border-radius:0 0 6px 6px;margin-top:22px}
.hold-foot .t{font-family:var(--font-num);font-weight:600;font-size:13px}
.hold-foot .dim-l{font-family:var(--font-num);font-size:10px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hold-foot .dim-l+.dim-l{margin-top:0}
.hold-foot .dim-l.over{color:var(--crit);font-weight:600}
.hold-foot .p{font-family:var(--font-num);font-size:10.5px;color:var(--muted)}
.bar{height:5px;border-radius:3px;background:var(--surface-2);margin:4px 6px 0;overflow:hidden}
.bar i{display:block;height:100%;background:var(--good)}
.bar i.warn{background:var(--warn)}.bar i.crit{background:var(--crit)}
.hold-body.free{position:relative;display:block;overflow:visible;touch-action:none;user-select:none;-webkit-user-select:none}
.fsvg{position:absolute;inset:0;width:100%;height:100%;display:block;overflow:hidden!important}
.fsvg .fgrid{stroke:var(--line);stroke-width:1;opacity:.7}
.fpoly{stroke:var(--hull);stroke-width:1;cursor:move;transition:opacity .15s}
.fpoly.sel{stroke:var(--fg);stroke-width:2.5}
.fpoly.locked{stroke-dasharray:5 3;cursor:default}
.fpoly.dim{opacity:.18}
.fmoving .fpoly.active{pointer-events:none;opacity:.85}
.fmoving .fh{display:none}
.flabel{position:absolute;display:flex;align-items:center;justify-content:center;pointer-events:none;overflow:hidden;color:var(--ink);font-size:11px;line-height:1.15;text-align:center;container-type:size;z-index:1}
.flabel span{display:block;padding:1px 3px;max-width:100%}
.flabel i{display:inline-block;width:7px;height:7px;border-radius:2px;margin-right:3px;box-shadow:0 0 0 1px rgba(255,255,255,.75)}
.flabel b{font-weight:600;white-space:nowrap}
.flabel .tn{display:block;font-family:var(--font-num);white-space:nowrap}
.flabel em{display:block;font-style:normal;opacity:.85;white-space:nowrap}
.flabel.dim{opacity:.18}
@container (max-height:40px){.flabel em{display:none}}
@container (max-height:26px){.flabel b,.flabel i{display:none}}
@container (max-width:34px){.flabel em,.flabel i{display:none}}
.fh{position:absolute;width:12px;height:12px;margin:0 0 -6px -6px;background:var(--surface);border:2px solid var(--fg);border-radius:2px;z-index:4;touch-action:none}
.fh::before{content:"";position:absolute;inset:-9px}
.fh.v{border-radius:50%;cursor:crosshair}
.fh.add{width:10px;height:10px;margin:0 0 -5px -5px;border-style:dashed;opacity:.75;cursor:copy}
.fh[data-d=n],.fh[data-d=s]{cursor:ns-resize}.fh[data-d=e],.fh[data-d=w]{cursor:ew-resize}
.fh[data-d=ne],.fh[data-d=sw]{cursor:nesw-resize}.fh[data-d=nw],.fh[data-d=se]{cursor:nwse-resize}
.fband{position:absolute;border:2px dashed var(--primary);background:var(--primary-soft);opacity:.7;pointer-events:none;z-index:5}
body.drawmode .hold-body.free{cursor:crosshair}
body.drawmode .hold-body.free .fpoly{cursor:crosshair}
.hold-body.t-ok{box-shadow:inset 0 0 0 3px var(--good)}
.hold-body.t-warn{box-shadow:inset 0 0 0 3px var(--warn)}
.hold-body.t-block{box-shadow:inset 0 0 0 3px var(--crit)}
.dlg select{width:100%;min-height:44px;border:1px solid var(--line-2);border-radius:8px;background:var(--surface);padding:0 10px;margin-bottom:10px}
.insp .tools2{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.hold.flash .hold-body{animation:flash 1.2s ease-out}
@keyframes flash{0%,40%{box-shadow:0 0 0 4px var(--primary)}100%{box-shadow:0 0 0 0 transparent}}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;padding:10px 16px 0;font-size:12px;color:var(--muted)}
.legend .sw{display:inline-block;width:22px;height:12px;vertical-align:-2px;margin-right:6px;border-radius:2px;background:linear-gradient(90deg,#6F9A72 0 5px,#fff 5px 6px,#2F6FD0 6px)}

/* lower grid */
.lower{display:grid;grid-template-columns:340px minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:980px){.lower{grid-template-columns:1fr}}
.side{display:grid;gap:16px}
.panel{padding:14px}
.panel h2,.tablecard h2{margin:0 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:8px}
.panel h2 .n{margin-left:auto;font-family:var(--font-num);text-transform:none;letter-spacing:0;color:var(--fg)}
.lpgrp{display:grid;gap:6px;margin-bottom:12px}
.lpgrp:last-child{margin-bottom:0}
.lpgrp header{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600}
.lpgrp header i{width:12px;height:12px;border-radius:3px;background:var(--c)}
.lpgrp header .num{margin-left:auto;font-weight:500;color:var(--muted)}
.chip{display:flex;align-items:center;gap:10px;min-height:44px;padding:6px 10px 6px 0;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;overflow:hidden}
.chip:hover{border-color:var(--line-2)}
.chip .stripe{align-self:stretch;width:8px;background:linear-gradient(90deg,var(--lp) 0 4px,var(--dp) 4px);flex:none;margin:-6px 0}
.chip .tx{min-width:0;flex:1}
.chip .tx b{font-weight:600}
.chip .tx small{display:block;color:var(--muted);font-size:12px}
.chip .t{font-family:var(--font-num);font-weight:600;white-space:nowrap}
.empty-note{color:var(--muted);font-size:13px;padding:6px 0}
.insp dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0 0 12px;font-size:13px}
.insp dt{color:var(--muted)}
.insp dd{margin:0}
.insp .acts{display:flex;flex-wrap:wrap;gap:6px}
.insp .moveto{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:10px}
.insp select{min-height:32px;border:1px solid var(--line-2);border-radius:6px;background:var(--surface);padding:0 6px}
.hint{font-size:12px;color:var(--muted);margin:10px 0 0}
kbd{font-family:var(--font-num);font-size:11px;border:1px solid var(--line-2);border-bottom-width:2px;border-radius:4px;padding:0 4px;background:var(--surface-2)}

/* tables */
.tablecard{padding:14px 14px 6px;min-width:0}
.tabs{display:flex;flex-wrap:wrap;gap:4px;border-bottom:1px solid var(--line);margin:0 -14px 12px;padding:0 10px}
.tabs button{border:0;background:none;min-height:38px;padding:0 10px;border-bottom:2px solid transparent;color:var(--muted);font-weight:500}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--primary);font-weight:600}
.tabs .badge{font-family:var(--font-num);font-size:11px;margin-left:4px;padding:0 6px;border-radius:9px;background:var(--warn-soft);color:var(--warn)}
.tbar{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.tbar p{margin:0;color:var(--muted);font-size:12.5px;flex:1;min-width:200px}
.tscroll{overflow-x:auto;margin-bottom:8px}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;text-align:left;padding:7px 8px;border-bottom:1px solid var(--line-2);white-space:nowrap}
td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
th.n,td.n{text-align:right}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--surface-2)}
tr.on td{background:var(--primary-soft)}
tfoot td{font-weight:600;border-top:1px solid var(--line-2);border-bottom:0}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;background:var(--c);vertical-align:-1px;margin-right:7px}
.dot.sq{border-radius:3px}
.hc{display:inline-block;font-family:var(--font-num);font-size:11.5px;padding:1px 6px;margin:1px 3px 1px 0;border-radius:4px;background:var(--surface-2);white-space:nowrap}
.prog{display:flex;align-items:center;gap:8px;min-width:110px}
.prog .bar{flex:1;margin:0}
.prog span{font-family:var(--font-num);font-size:12px;width:38px;text-align:right}
.wlist{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.wlist li{display:flex;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:var(--r)}
.wlist li .m{flex:1;min-width:0}
.log{font-size:13px;list-style:none;margin:0;padding:0}
.log li{display:flex;gap:12px;padding:6px 0;border-bottom:1px solid var(--line)}
.log time{font-family:var(--font-num);color:var(--muted);font-size:12px;white-space:nowrap}
.mx td,.mx th{text-align:right}
.mx td:first-child,.mx th:first-child{text-align:left}
.mx .zero{color:var(--muted)}

/* setup */
.setup{display:grid;gap:16px}
.setup .panel{overflow:hidden}
.setup table input,.setup table select{width:100%;min-width:70px;min-height:34px;border:1px solid var(--line);border-radius:6px;background:var(--surface);padding:0 8px}
.setup table input[type=color]{padding:2px;width:44px;min-width:44px}
.setup table input.n{text-align:right;font-family:var(--font-num)}
.setup td{padding:5px 6px}
.formrow{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:12px}
.field{display:grid;gap:4px;font-size:12.5px;color:var(--muted)}
.field input{min-height:36px;border:1px solid var(--line-2);border-radius:6px;background:var(--surface);padding:0 10px;color:var(--fg);min-width:0}
.icon-btn{width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--muted)}
.icon-btn:hover{color:var(--crit);border-color:var(--crit)}

/* ghost, modal, toast */
.ghost{position:fixed;left:0;top:0;z-index:100;pointer-events:none;padding:8px 10px 8px 14px;border-radius:var(--r);background:linear-gradient(90deg,var(--lp) 0 6px,var(--surface) 6px);border:1px solid var(--line-2);box-shadow:0 8px 24px rgba(0,0,0,.18);font-size:12.5px;min-width:180px;max-width:280px}
.ghost b{display:block}
.ghost .g2{font-family:var(--font-num);font-size:12px;margin-top:2px}
.ghost .g3{font-size:12px;margin-top:3px}
.ghost .g3.warn{color:var(--warn)}.ghost .g3.block{color:var(--crit)}.ghost .g3.ok{color:var(--good)}
.modal{position:fixed;inset:0;z-index:200;background:rgba(8,14,20,.45);display:flex;align-items:center;justify-content:center;padding:16px}
.dlg{width:min(460px,100%);max-height:90vh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;box-shadow:0 16px 48px rgba(0,0,0,.25)}
.dlg h3{margin:0 0 12px;font-size:16px}
.dlg label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:4px}
.dlg input[type=number],.dlg textarea{width:100%;min-height:44px;border:1px solid var(--line-2);border-radius:8px;background:var(--surface);padding:0 12px;font-family:var(--font-num);font-size:16px}
.dlg textarea{min-height:160px;padding:10px;font-size:12px}
.dlg .quick{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.dlg .err{color:var(--crit);font-size:13px;min-height:1em;margin:8px 0 0}
.dlg .foot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;flex-wrap:wrap}
.dlg p{margin:0 0 8px}
.pickbar{position:fixed;left:0;right:0;bottom:0;z-index:150;display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:var(--primary);color:var(--primary-fg);font-size:14px}
.pickbar b{font-weight:600}
.pickbar .btn{background:var(--primary-fg);color:var(--primary);border-color:var(--primary-fg)}
.chip.picked{outline:2.5px solid var(--primary);outline-offset:1px}
body.picking .layer[data-tier]{cursor:copy}
body.picking .layer.free span{opacity:1}
body.picking .hold-body{box-shadow:0 0 0 2px var(--primary-soft)}
.toasts{position:fixed;left:50%;bottom:calc(72px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:300;display:grid;gap:8px;width:min(520px,calc(100% - 32px))}
.toast{padding:10px 14px;border-radius:var(--r);background:var(--fg);color:var(--bg);font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.2);display:flex;gap:8px;align-items:center}
.toast.warn{background:var(--warn-soft);color:var(--warn);border:1px solid var(--warn)}
.toast.crit{background:var(--crit-soft);color:var(--crit);border:1px solid var(--crit)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:600px){.kpi .v{font-size:17px}.brand small{max-width:160px}}
</style>

<body>

    <button class="btn sm" id="b-redo" title="Redo (Ctrl+Y)"><svg class="ico" viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H9a5 5 0 0 0 0 10h3"/></svg>Redo</button>

    </div>

    <div class="lower">

<div class="modal" id="modal" hidden><div class="dlg" role="dialog" aria-modal="true" aria-labelledby="m-title"><h3 id="m-title"></h3><div id="m-body"></div><div class="foot" id="m-foot"></div></div></div>
<div class="pickbar" id="pickbar" hidden><span id="picktext"></span><span style="flex:1"></span><button class="btn sm" id="b-pickcancel">Cancel</button></div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script>
(function(){
'use strict';
const APP_VERSION='1.5.0';
const LS='holdplanner.plan.v1', LST='holdplanner.theme';
const DP_PAL=['#2F6FD0','#D9731A','#0F9488','#C0367C','#7A8A1C','#7B4BC4','#B8860B','#2D8FD6'];
const LP_PAL=['#5B6B7F','#B59A6A','#6F9A72','#A35C3C','#8A5A83','#4F7A96'];
const IN_ARTIFACT=!(location.protocol==='https:'&&!/claude\.(ai|site|com)|claudeusercontent/.test(location.hostname));
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const r3=x=>Math.round(x*1000)/1000;
const fmt=n=>{const v=Math.round(n*10)/10;return v.toLocaleString('en-US',{maximumFractionDigits:Math.abs(v)<100&&v%1?1:0})};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=p=>p+Math.random().toString(36).slice(2,8);
const sum=(a,f)=>a.reduce((x,y)=>x+f(y),0);
const byOrder=(a,b)=>a.order-b.order;
const ICONS={alert:'<path d="M12 3 2 20h20Z"/><path d="M12 10v4"/><path d="M12 17h.01"/>',check:'<path d="m5 12 5 5L20 7"/>'};
const ic=n=>`<svg class="ico" viewBox="0 0 24 24" aria-hidden="true">${ICONS[n]||''}</svg>`;

/* ---------- ship profile: MV Kite Arrow (Toucan class), from G2 Ocean cargo plan ---------- */
// [hold, length m, breadth m, height m, bale/grain m3, tank top t/m2]
const KITE=[[1,13.2,18.0,18.38,4367,35],[2,13.2,23.0,18.88,5732,25],[3,13.2,27.4,18.88,6828.5,35],[4,13.2,27.4,18.88,6828.5,25],[5,13.2,27.4,18.88,6828.5,35],
  [6,13.2,27.4,18.88,6828.5,25],[7,13.2,27.4,18.88,6828.5,35],[8,13.2,27.4,18.88,6828.5,25],[9,13.2,27.4,15.88,5743.5,35],[10,13.2,23.0,14.88,4517.5,25]];
const kiteHolds=()=>KITE.map(([no,L,B,Hh,bale,tt])=>({no,L,B,H:Hh,baleM3:bale,ttT:tt,deckT:2.5}));
const area=h=>(h.L&&h.B)?h.L*h.B:0;
const hMax=h=>area(h)&&h.ttT?r3(area(h)*h.ttT):(h.maxT||0);
const fmtB=v=>Number(v||0).toLocaleString('en-US',{maximumFractionDigits:1});
const dimS=h=>h.L?`${h.L}×${h.B}×${h.H}`:'';
const deckMax=h=>area(h)?Math.floor(area(h)*(h.deckT||2.5)):0;
function migrate(p){
  if(p&&p.ship&&p.ship.holds&&!p.ship.holds.every(h=>h.L)){p.ship.holds=kiteHolds();if(/sample|example/i.test(p.ship.name||''))p.ship.name='MV Kite Arrow';p.ship.cls='Toucan class';p.log=p.log||[];p.log.unshift({at:Date.now(),text:'Hold dimensions set to MV Kite Arrow capacity plan'})}
  return p;
}
/* ---------- sample voyage ---------- */
function sample(){
  const holds=kiteHolds();
  const ports=[
    {id:'vix',name:'Vitória',code:'BRVIX',role:'load',seq:1,color:LP_PAL[0]},
    {id:'ssz',name:'Santos',code:'BRSSZ',role:'load',seq:2,color:LP_PAL[1]},
    {id:'pcl',name:'Portocel',code:'BRPOC',role:'load',seq:3,color:LP_PAL[2]},
    {id:'anr',name:'Antwerp',code:'BEANR',role:'discharge',seq:1,color:DP_PAL[0]},
    {id:'ham',name:'Hamburg',code:'DEHAM',role:'discharge',seq:2,color:DP_PAL[1]},
    {id:'gdy',name:'Gdynia',code:'PLGDY',role:'discharge',seq:3,color:DP_PAL[2]}];
  const parcels=[
    {id:'P01',ref:'BKP-ANR-01',grade:'BKP',lp:'ssz',dp:'anr',bookedT:9000,sf:1.35},
    {id:'P02',ref:'BKP-HAM-02',grade:'BKP',lp:'ssz',dp:'ham',bookedT:7500,sf:1.35},
    {id:'P03',ref:'BKP-GDY-03',grade:'BKP',lp:'ssz',dp:'gdy',bookedT:4000,sf:1.35},
    {id:'P04',ref:'COIL-ANR-04',grade:'Steel coils',lp:'vix',dp:'anr',bookedT:6000,sf:0.35},
    {id:'P05',ref:'PLT-HAM-05',grade:'Steel plates',lp:'vix',dp:'ham',bookedT:3500,sf:0.4},
    {id:'P06',ref:'BEKP-HAM-06',grade:'BEKP',lp:'pcl',dp:'ham',bookedT:6500,sf:1.4},
    {id:'P07',ref:'BEKP-GDY-07',grade:'BEKP',lp:'pcl',dp:'gdy',bookedT:5000,sf:1.4}];
  const S=(p,h,t,q)=>({id:uid('s'),parcel:p,hold:h,tier:t,order:0,t:q,locked:false});
  const stows=[S('P04',1,1,1500),S('P07',2,1,2000),S('P06',2,2,2000),S('P03',3,1,2000),S('P02',3,2,2600),
    S('P05',4,1,1800),S('P01',4,2,2700),S('P04',5,1,2000),S('P01',5,2,2600),S('P02',6,1,2500),S('P01',6,2,2200),
    S('P01',7,1,1200),S('P06',7,2,1500),S('P05',8,1,1700),S('P06',8,2,2600),S('P03',9,1,2000),S('P07',9,2,1800)];
  return {schema:1,sample:true,ship:{name:'MV Kite Arrow',cls:'Toucan class',tiers:4,holds},voyage:{name:'Voyage 2611 · ECSA to Continent',tolPct:5},
    ports,parcels,stows,log:[{at:Date.now(),text:'Sample voyage created'}]};
}
function blank(base){return {schema:1,sample:false,ship:base.ship,voyage:{name:'New voyage',tolPct:base.voyage.tolPct||5},ports:[],parcels:[],stows:[],log:[{at:Date.now(),text:'Blank voyage started'}]}}
function load(){try{const s=localStorage.getItem(LS);if(!s)return null;const p=JSON.parse(s);return p&&p.ship&&Array.isArray(p.stows)?p:null}catch(e){return null}}

let plan=migrate(load())||sample();
const ui={view:'plan',draw:false,snap:true,pts:false,pick:null,sel:null,focus:null,tab:'lp',scale:'vol',part:false,savedAt:null};
let undoS=[],redoS=[];

/* ---------- lookups ---------- */
const P=id=>plan.ports.find(p=>p.id===id);
const PC=id=>plan.parcels.find(p=>p.id===id);
const ST=id=>plan.stows.find(s=>s.id===id);
const H=n=>plan.ship.holds.find(h=>h.no===n);
const LPs=()=>plan.ports.filter(p=>p.role==='load').sort((a,b)=>a.seq-b.seq);
const DPs=()=>plan.ports.filter(p=>p.role==='discharge').sort((a,b)=>a.seq-b.seq);
const seq=id=>P(id)?.seq??99;
const pname=id=>P(id)?.name??'?';
const pcol=id=>P(id)?.color??'#888888';
const stowedOf=(pid,st=plan.stows)=>sum(st.filter(s=>s.parcel===pid),s=>s.t);
const remOf=pid=>r3((PC(pid)?.bookedT||0)-stowedOf(pid));
const hStows=(n,st=plan.stows)=>st.filter(s=>s.hold===n);
const hT=(n,st)=>sum(hStows(n,st),s=>s.t);
const hV=(n,st)=>sum(hStows(n,st),s=>s.t*(PC(s.parcel)?.sf||0));
const pct=(a,b)=>b>0?a/b*100:0;
const maxTier=(n,st)=>Math.max(0,...hStows(n,st).map(s=>s.tier));
const autoTier=n=>{const m=maxTier(n);return m===0?1:Math.min(plan.ship.tiers,m+1)};

function lum(hex){const n=parseInt(hex.slice(1),16);return [(n>>16)&255,(n>>8)&255,n&255].map(v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)}).reduce((a,v,i)=>a+v*[.2126,.7152,.0722][i],0)}
function ink(hex){if(!/^#[0-9a-f]{6}$/i.test(hex||''))return '#111A22';const L=lum(hex);return (1.05/(L+.05))>=((L+.05)/.05)?'#FFFFFF':'#111A22'}

/* ---------- free draw layout: shapes are polygons in hold space, x 0..1 fwd/aft width, y 0..1 tank top to hatch ---------- */
const isFree=()=>plan.layout==='free';
const r4=v=>Math.round(v*10000)/10000;
const clamp01=v=>Math.min(1,Math.max(0,v));
const bb=pts=>{let x0=1,y0=1,x1=0,y1=0;for(const[x,y]of pts){x0=Math.min(x0,x);x1=Math.max(x1,x);y0=Math.min(y0,y);y1=Math.max(y1,y)}return {x0,y0,x1,y1,w:x1-x0,h:y1-y0}};
const rectPts=(x0,y0,x1,y1)=>[[r4(x0),r4(y0)],[r4(x1),r4(y0)],[r4(x1),r4(y1)],[r4(x0),r4(y1)]];
const ptsStr=pts=>pts.map(([x,y])=>`${(x*1000).toFixed(1)},${((1-y)*1000).toFixed(1)}`).join(' ');
function polyArea(pts){let a=0;for(let i=0;i<pts.length;i++){const[x1,y1]=pts[i],[x2,y2]=pts[(i+1)%pts.length];a+=x1*y2-x2*y1}return Math.abs(a)/2}
const isRect=pts=>pts.length===4&&new Set(pts.map(p=>p[0])).size===2&&new Set(pts.map(p=>p[1])).size===2;
function above(a,b){if(!a.shape||!b.shape)return false;const A=bb(a.shape.pts),B=bb(b.shape.pts);const ov=Math.min(A.x1,B.x1)-Math.max(A.x0,B.x0);
  return ov>0.02&&A.y0>=B.y1-0.03&&(A.y0+A.y1)>(B.y0+B.y1)}
function freeTiers(list){const memo=new Map();const t=s=>{if(memo.has(s))return memo.get(s);memo.set(s,1);let m=0;for(const o of list)if(o!==s&&above(s,o))m=Math.max(m,t(o));memo.set(s,m+1);return m+1};list.forEach(s=>{s.tier=Math.min(t(s),99)})}
const shapeKey=s=>`${s.hold}|${s.tier}|${s.t}`;
function afterFree(){if(!isFree())return;plan.ship.holds.forEach(h=>freeTiers(hStows(h.no).filter(s=>s.shape)));plan.stows.forEach(s=>{if(s.shape)s.shape.k=shapeKey(s)})}
function stackToShapes(){
  for(const h of plan.ship.holds){
    const list=hStows(h.no);if(!list.length)continue;
    if(list.every(s=>s.shape&&s.shape.k===shapeKey(s)))continue;
    let y=0;const top=maxTier(h.no);
    for(let k=1;k<=top;k++){const ts=list.filter(s=>s.tier===k).sort(byOrder);if(!ts.length)continue;
      let hg=Math.max(0.06,sum(ts,s=>s.t*(PC(s.parcel)?.sf||0))/(h.baleM3||1));if(y+hg>1){y=Math.max(0,1-hg);if(y<0.0001)hg=1}
      const T=sum(ts,s=>s.t)||1;let x=0;ts.forEach(s=>{const w=s.t/T;s.shape={pts:rectPts(x,y,x+w,Math.min(1,y+hg))};x+=w});y=Math.min(1,y+hg)}
  }
}
function shapesToStack(){
  for(const h of plan.ship.holds){const list=hStows(h.no).filter(s=>s.shape);freeTiers(list);
    list.forEach(s=>s.tier=Math.min(plan.ship.tiers,s.tier));
    const tiers=[...new Set(list.map(s=>s.tier))];tiers.forEach(k=>list.filter(s=>s.tier===k).sort((a,b)=>bb(a.shape.pts).x0-bb(b.shape.pts).x0).forEach((s,i)=>s.order=i));
    list.forEach(s=>s.shape.k=shapeKey(s));}
}
function gravity(holdNo,x0,x1,yStart,exId,st=plan.stows){let floor=0;for(const o of hStows(holdNo,st)){if(o.id===exId||!o.shape)continue;const B=bb(o.shape.pts);if(Math.min(B.x1,x1)-Math.max(B.x0,x0)>0.005&&B.y1<=yStart+0.001)floor=Math.max(floor,B.y1)}return floor}
function newShape(holdNo,t,sf,pt){
  const h=H(holdNo),vf=Math.max(0.04,(t*sf)/(h.baleM3||1));
  let w=hStows(holdNo).some(s=>s.shape)?0.5:1,hh=vf/w;if(hh>1){w=1;hh=Math.min(1,vf)}hh=Math.max(0.05,hh);
  let x0=clamp01((pt?pt.x:0.5)-w/2);if(x0+w>1)x0=1-w;
  let y0=gravity(holdNo,x0,x0+w,pt?clamp01(pt.y-hh/2):1);if(y0+hh>1)y0=Math.max(0,1-hh);
  return {pts:rectPts(x0,y0,x0+w,y0+hh)};
}

/* ---------- rules ---------- */
function holdIssues(n,st=plan.stows){
  const h=H(n),list=hStows(n,st),out=[];if(!h)return out;
  const t=sum(list,s=>s.t),v=sum(list,s=>s.t*(PC(s.parcel)?.sf||0));
  if(t>hMax(h)+0.001)out.push({sev:'crit',hold:n,msg:area(h)?`Hold ${n}: ${(t/area(h)).toFixed(1)} t/m² on tank top exceeds ${h.ttT} t/m² (max ${fmt(hMax(h))} t)`:`Hold ${n}: ${fmt(t)} t exceeds hold max ${fmt(hMax(h))} t`});
  if(v>h.baleM3+0.5)out.push({sev:'warn',hold:n,msg:`Hold ${n}: ${fmt(v)} m³ exceeds bale capacity ${fmt(h.baleM3)} m³`});
  for(const lo of list)for(const hi of list){
    if(isFree()&&lo.shape&&hi.shape?!above(hi,lo):hi.tier<=lo.tier)continue;const a=PC(lo.parcel),b=PC(hi.parcel);if(!a||!b)continue;
    if(seq(a.dp)<seq(b.dp))out.push({sev:'warn',hold:n,msg:`Hold ${n}: ${fmt(hi.t)} t for ${pname(b.dp)} (T${hi.tier}) overstows ${fmt(lo.t)} t for ${pname(a.dp)} (T${lo.tier})`});
    if(seq(a.lp)>seq(b.lp))out.push({sev:'warn',hold:n,msg:`Hold ${n}: T${lo.tier} cargo from ${pname(a.lp)} loads after T${hi.tier} cargo from ${pname(b.lp)}, restow needed`});
  }
  return out;
}
function validate(){
  const out=[];plan.ship.holds.forEach(h=>out.push(...holdIssues(h.no)));
  const tol=(plan.voyage.tolPct||0)/100;
  for(const p of plan.parcels){
    const s=stowedOf(p.id),rem=r3(p.bookedT-s);
    if(s>p.bookedT*(1+tol)+0.001)out.push({sev:'warn',msg:`${p.id}: stowed ${fmt(s)} t is above booked ${fmt(p.bookedT)} t plus ${plan.voyage.tolPct}% tolerance`});
    else if(rem>0.001)out.push({sev:'info',msg:`${p.id} ${p.grade}: ${fmt(rem)} t from ${pname(p.lp)} for ${pname(p.dp)} not yet stowed`});
    if(!P(p.lp)||!P(p.dp))out.push({sev:'warn',msg:`${p.id}: load or discharge port missing, check Setup`});
  }
  const rank={crit:0,warn:1,info:2};return out.sort((a,b)=>rank[a.sev]-rank[b.sev]);
}
function simulate(mv){
  const st=plan.stows.map(s=>({...s}));
  if(mv.kind==='parcel')st.push({id:'_n',parcel:mv.id,hold:mv.hold,tier:mv.tier,order:999,t:mv.t,shape:mv.shape||(isFree()?newShape(mv.hold,mv.t,PC(mv.id)?.sf||1,mv.pt):undefined)});
  else{const s=st.find(x=>x.id===mv.id);if(mv.t>=s.t-0.001){s.hold=mv.hold;s.tier=mv.tier}else{s.t-=mv.t;st.push({...s,id:'_n',hold:mv.hold,tier:mv.tier,t:mv.t})}}
  return st;
}
function canDrop(mv){
  const st=simulate(mv),iss=holdIssues(mv.hold,st),before=hT(mv.hold),after=hT(mv.hold,st);
  const crit=iss.find(i=>i.sev==='crit');if(crit)return {level:'block',msg:crit.msg,before,after};
  const base=holdIssues(mv.hold).map(i=>i.msg),fresh=iss.filter(i=>!base.includes(i.msg));
  return fresh.length?{level:'warn',msg:fresh[0].msg,before,after}:{level:'ok',msg:'No conflicts',before,after};
}

/* ---------- moves ---------- */
function place(s,beforeId){
  const list=plan.stows.filter(x=>x!==s&&x.hold===s.hold&&x.tier===s.tier).sort(byOrder);
  let i=beforeId?list.findIndex(x=>x.id===beforeId):-1;if(i<0)i=list.length;list.splice(i,0,s);list.forEach((x,k)=>x.order=k);
}
function desc(pid){const p=PC(pid);return `${p.id} ${p.grade} (${P(p.lp)?.code||'?'} to ${P(p.dp)?.code||'?'})`}
function applyMove(mv){
  mv.t=r3(mv.t);const r=canDrop(mv);
  if(r.level==='block'){toast(r.msg,'crit');return false}
  let label;
  if(mv.kind==='parcel')label=`Stowed ${fmt(mv.t)} t ${desc(mv.id)} in H${mv.hold}${isFree()?'':' T'+mv.tier}`;
  else{const s=ST(mv.id);label=`Moved ${fmt(mv.t)} t ${desc(s.parcel)} from H${s.hold} T${s.tier} to H${mv.hold} T${mv.tier}`}
  commit(()=>{
    let tg;
    if(mv.kind==='parcel'){tg={id:uid('s'),parcel:mv.id,hold:mv.hold,tier:mv.tier,order:0,t:mv.t,locked:false};if(isFree())tg.shape=newShape(mv.hold,mv.t,PC(mv.id).sf||1,mv.pt);plan.stows.push(tg)}
    else{const s=ST(mv.id);if(mv.t>=s.t-0.001){s.hold=mv.hold;s.tier=mv.tier;tg=s}else{s.t=r3(s.t-mv.t);tg={...s,id:uid('s'),hold:mv.hold,tier:mv.tier,t:mv.t};plan.stows.push(tg)}}
    place(tg,mv.beforeId);
    const twin=!isFree()&&plan.stows.find(x=>x!==tg&&x.parcel===tg.parcel&&x.hold===tg.hold&&x.tier===tg.tier&&!x.locked&&!tg.locked);
    if(twin){twin.t=r3(twin.t+tg.t);plan.stows=plan.stows.filter(x=>x!==tg);tg=twin}
    ui.sel=tg.id;
  },label);
  if(r.level==='warn')toast(r.msg,'warn');
  return true;
}
function unstow(id){const s=ST(id);if(!s)return;commit(()=>{plan.stows=plan.stows.filter(x=>x.id!==id);if(ui.sel===id)ui.sel=null},`Unstowed ${fmt(s.t)} t ${desc(s.parcel)} from H${s.hold} T${s.tier}`)}

function qty(opts){
  const quick=(opts.quick||[]).map((q,i)=>`<button class="btn sm" type="button" data-q="${q.v}">${esc(q.l)} · ${fmt(q.v)} t</button>`).join('');
  modal(opts.title,`<label for="q-in">Tonnes</label><input id="q-in" type="number" inputmode="decimal" min="0" step="any" value="${r3(opts.def)}"><div class="quick">${quick}</div><p class="hint">${opts.info||''}</p><p class="err" id="q-err" role="alert"></p>`,
   [{label:'Cancel'},{label:opts.ok||'Confirm',kind:'primary',run:()=>{const t=parseFloat($('#q-in').value);
     if(!(t>0)){$('#q-err').textContent='Enter a quantity above zero.';return false}
     if(t>opts.max+0.001){$('#q-err').textContent=`Only ${fmt(opts.max)} t available. Enter ${fmt(opts.max)} t or less.`;return false}
     setTimeout(()=>opts.run(r3(t)),0)}}]);
  $$('#m-body [data-q]').forEach(b=>b.onclick=()=>{$('#q-in').value=b.dataset.q;$('#q-in').focus()});
}

function renderShip(){
  const tiers=plan.ship.tiers;let html='';
  for(const h of plan.ship.holds){
    const list=hStows(h.no),t=sum(list,s=>s.t),v=sum(list,s=>s.t*(PC(s.parcel)?.sf||0));
    const wt=pct(t,hMax(h)),vol=pct(v,h.baleM3),top=maxTier(h.no),iss=holdIssues(h.no);
    let body='';
    if(!isFree())for(let k=1;k<=top;k++){
      const ts=list.filter(s=>s.tier===k).sort(byOrder);
      if(!ts.length){body+=`<div class="layer empty" data-hold="${h.no}" data-tier="${k}" aria-label="Hold ${h.no} tier ${k} empty"></div>`;continue}
      const frac=ui.scale==='vol'?pct(sum(ts,s=>s.t*(PC(s.parcel)?.sf||0)),h.baleM3):pct(sum(ts,s=>s.t),hMax(h));
      body+=`<div class="layer" data-hold="${h.no}" data-tier="${k}" style="flex:0 1 ${Math.max(frac,0.1).toFixed(2)}%"><span class="tier-tag">T${k}</span>${ts.map(stowHtml).join('')}</div>`;
    }
    if(isFree()){}else if(top<tiers)body+=`<div class="layer free" data-hold="${h.no}" data-tier="${top+1}"><span>T${top+1}</span></div>`;
    else body+=`<div class="layer fullstack" aria-hidden="true"></div>`;
    const bodyHtml=isFree()?freeBody(h,list):`<div class="hold-body" style="--d:${h.H?(h.H/Math.max(...plan.ship.holds.map(x=>x.H||0))).toFixed(3):1}">${body}</div>`;
    const sev=iss.some(i=>i.sev==='crit')?'crit':iss.length?'warn':'';
    const bs=Math.max(wt,vol)>100?'crit':Math.max(wt,vol)>95?'warn':'';
    const n=plan.ship.holds.length,crane=h.no===n||h.no===n-1;
    html+=`<div class="hold" id="hold-${h.no}" data-holdcol="${h.no}">${crane?GANTRY+(h.no===n?'<span class="gantry-tag">2 × GANTRY CRANE, PARKED AFT</span>':''):''}
      <div class="hold-head" data-hold-auto="${h.no}" title="Hold ${h.no}${iss.length?': '+esc(iss.map(i=>i.msg).join('; ')):''}">${h.no}${sev?`<svg class="ico ${sev}" viewBox="0 0 24 24" role="img" aria-label="${iss.length} issues"><path d="M12 3 2 20h20Z"/><path d="M12 10v4"/><path d="M12 17h.01"/></svg>`:''}</div>
      ${bodyHtml}
      <div class="hold-foot" data-hold-auto="${h.no}"><div class="t">${fmt(t)} t</div><div class="p">${vol.toFixed(0)}% vol${area(h)?'':' · '+wt.toFixed(0)+'% wt'}</div><div class="bar"><i class="${bs}" style="width:${Math.min(100,Math.max(wt,vol)).toFixed(1)}%"></i></div>${h.L?`<div class="dim-l" title="L × B × H metres">${dimS(h)}</div><div class="dim-l">${fmtB(h.baleM3)} m³</div><div class="dim-l${t/area(h)>h.ttT?' over':''}" title="Tank top load / limit">TT ${(t/area(h)).toFixed(1)}/${h.ttT} t/m²</div>`:''}</div></div>`;
  }
  $('#holds').innerHTML=html;
}

const TABS=[['lp','Load ports'],['dp','Discharge ports'],['mx','LP × DP'],['holds','Holds'],['parcels','Parcels'],['warn','Warnings'],['log','Change log']];
let lastCSV='';
function renderTables(){

const csvOf=rows=>rows.map(r=>r.map(c=>{c=String(c??'');return /[",\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c}).join(',')).join('\n');
const prog=v=>`<div class="prog"><div class="bar"><i class="${v>100.05?'crit':v<99.95?'warn':''}" style="width:${Math.min(100,v).toFixed(1)}%"></i></div><span>${v.toFixed(0)}%</span></div>`;
function holdChips(filter){const m={};plan.stows.filter(s=>filter(PC(s.parcel))).forEach(s=>m[s.hold]=(m[s.hold]||0)+s.t);return Object.keys(m).sort((a,b)=>a-b).map(h=>({h,t:m[h]}))}

function overstowedFor(dpId){
  let t=0;const n=seq(dpId);
  plan.ship.holds.forEach(h=>{const list=hStows(h.no);list.forEach(lo=>{if(PC(lo.parcel)?.dp!==dpId)return;if(list.some(hi=>hi.tier>lo.tier&&seq(PC(hi.parcel)?.dp)>n))t+=lo.t})});
  return t;
}

function tMX(){
  const lps=LPs(),dps=DPs();

  const foot=`<tr><td>Total booked</td>${dps.map(d=>`<td class="n">${fmt(sum(lps,l=>cell(l.id,d.id).b))}</td>`).join('')}<td class="n">${fmt(sum(plan.parcels,p=>p.bookedT))}</td></tr>`;
  return {note:'Tonnes stowed / booked for every load and discharge port pair.',
   html:`<table class="mx"><thead><tr><th>LP \\ DP</th>${dps.map(d=>`<th><span class="dot" style="--c:${d.color}"></span>${esc(d.name)}</th>`).join('')}<th>Total</th></tr></thead><tbody>${body}</tbody><tfoot>${foot}</tfoot></table>`,
   csv:csvOf([['LP / DP',...dps.map(d=>d.name+' stowed',),...dps.map(d=>d.name+' booked')],...lps.map(l=>[l.name,...dps.map(d=>r3(cell(l.id,d.id).s)),...dps.map(d=>r3(cell(l.id,d.id).b))])])};
}
function tHolds(){
  const rows=plan.ship.holds.map(h=>{const list=hStows(h.no);const t=sum(list,s=>s.t),v=sum(list,s=>s.t*(PC(s.parcel)?.sf||0));
    return {h,t,v,lps:[...new Set(list.map(s=>PC(s.parcel)?.lp))],dps:[...new Set(list.map(s=>PC(s.parcel)?.dp))],iss:holdIssues(h.no)}});
  const dots=(ids,sq)=>ids.map(id=>`<span class="dot${sq?' sq':''}" style="--c:${pcol(id)}" title="${esc(pname(id))}"></span>`).join('');
  const body=rows.map(r=>{const A=area(r.h),ttL=A?r.t/A:0;return `<tr><td class="num"><b>${r.h.no}</b></td><td class="num" style="white-space:nowrap">${dimS(r.h)}</td><td class="n">${A?fmtB(A):''}</td><td class="n">${fmtB(r.h.baleM3)}</td><td class="n">${fmt(r.v)}</td><td class="n">${pct(r.v,r.h.baleM3).toFixed(0)}%</td><td class="n">${fmt(r.t)}</td><td class="n" style="${ttL>r.h.ttT?'color:var(--crit);font-weight:600':''}">${A?ttL.toFixed(1)+' / '+r.h.ttT:''}</td><td class="n">${fmt(hMax(r.h))}</td><td class="n">${deckMax(r.h)?fmt(deckMax(r.h)):''}</td><td>${dots(r.lps,true)}</td><td>${dots(r.dps)}</td><td>${r.iss.length?`<span class="pill ${r.iss.some(i=>i.sev==='crit')?'crit':'warn'}" title="${esc(r.iss.map(i=>i.msg).join('\n'))}">${r.iss.length} issue${r.iss.length>1?'s':''}</span>`:r.t?'<span class="pill good">OK</span>':'<span class="pill info">Empty</span>'}</td><td>${r.t?`<button class="btn sm" data-clear="${r.h.no}">Clear</button>`:''}</td></tr>`}).join('');
  const T=sum(rows,r=>r.t),V=sum(rows,r=>r.v),B=sum(rows,r=>r.h.baleM3);
  return {note:'Dimensions L × B × H, tank top area and limits from the MV Kite Arrow capacity plan. Tank top load = hold tonnes ÷ L × B. Hatch cover max at 2.5 t/m².',
   html:`<table><thead><tr><th>Hold</th><th>L × B × H m</th><th class="n">Area m²</th><th class="n">Bale m³</th><th class="n">Used m³</th><th class="n">% vol</th><th class="n">Stowed t</th><th class="n">TT t/m² used / max</th><th class="n">TT max t</th><th class="n">Hatch max t</th><th>LPs</th><th>DPs</th><th>Status</th><th></th></tr></thead><tbody>${body}</tbody><tfoot><tr><td>Total</td><td></td><td></td><td class="n">${fmtB(B)}</td><td class="n">${fmt(V)}</td><td class="n">${pct(V,B).toFixed(0)}%</td><td class="n">${fmt(T)}</td><td colspan="7"></td></tr></tfoot></table>`,
   csv:csvOf([['Hold','L m','B m','H m','Area m2','Bale m3','Used m3','% vol','Stowed t','TT used t/m2','TT max t/m2','TT max t','Hatch max t','LPs','DPs'],...rows.map(r=>{const A=area(r.h);return [r.h.no,r.h.L,r.h.B,r.h.H,A?r3(A):'',r.h.baleM3,Math.round(r.v),pct(r.v,r.h.baleM3).toFixed(1),r3(r.t),A?(r.t/A).toFixed(2):'',r.h.ttT,hMax(r.h),deckMax(r.h),r.lps.map(pname).join('; '),r.dps.map(pname).join('; ')]})])};
}
function tParcels(){
  const rows=plan.parcels.map(p=>({p,s:stowedOf(p.id),r:remOf(p.id),loc:plan.stows.filter(s=>s.parcel===p.id).sort((a,b)=>a.hold-b.hold||a.tier-b.tier)}));
  const body=rows.map(x=>{const st=x.s<=0.001?['info','Unstowed']:x.r>0.001?['warn','Part']:x.r<-0.001?['warn','Over']:['good','Full'];
    return `<tr><td class="num"><b>${esc(x.p.id)}</b></td><td>${esc(x.p.ref||'')}</td><td>${esc(x.p.grade)}</td><td><span class="dot sq" style="--c:${pcol(x.p.lp)}"></span>${esc(pname(x.p.lp))}</td><td><span class="dot" style="--c:${pcol(x.p.dp)}"></span>${esc(pname(x.p.dp))}</td><td class="n">${fmt(x.p.bookedT)}</td><td class="n">${fmt(x.s)}</td><td class="n">${fmt(x.r)}</td><td class="n">${x.p.sf}</td><td>${x.loc.map(s=>`<span class="hc">H${s.hold}T${s.tier} ${fmt(s.t)}</span>`).join('')}</td><td><span class="pill ${st[0]}">${st[1]}</span></td></tr>`}).join('');
  return {note:'Every booking with where its tonnes sit. A parcel can be split across several holds and tiers.',
   html:`<table><thead><tr><th>Parcel</th><th>Ref</th><th>Grade</th><th>LP</th><th>DP</th><th class="n">Booked t</th><th class="n">Stowed t</th><th class="n">Remaining t</th><th class="n">SF</th><th>Stowage</th><th>Status</th></tr></thead><tbody>${body||'<tr><td colspan="11" class="empty-note">No parcels. Add them in Setup.</td></tr>'}</tbody></table>`,
   csv:csvOf([['Parcel','Ref','Grade','LP','DP','Booked t','Stowed t','Remaining t','SF','Stowage'],...rows.map(x=>[x.p.id,x.p.ref,x.p.grade,pname(x.p.lp),pname(x.p.dp),x.p.bookedT,r3(x.s),x.r,x.p.sf,x.loc.map(s=>`H${s.hold}T${s.tier} ${r3(s.t)}`).join('; ')])])};
}
function tWarn(w){

   html:w.length?`<ul class="wlist">${w.map(x=>`<li><span class="pill ${x.sev}">${lab[x.sev]}</span><span class="m">${esc(x.msg)}</span>${x.hold?`<button class="btn sm" data-show="${x.hold}">Show hold</button>`:''}</li>`).join('')}</ul>`:'<p class="empty-note">No warnings. All cargo stowed within limits and in rotation order.</p>',
   csv:csvOf([['Severity','Message'],...w.map(x=>[x.sev,x.msg])])};
}
function tLog(){
  const d=t=>{const x=new Date(t);return x.toLocaleDateString('en-GB',{day:'2-digit',month:'short'})+' '+x.toTimeString().slice(0,5)};

function editField(el){
  const e=el.dataset.e,f=el.dataset.f,id=el.dataset.id;let v=el.value;
  const numF=['seq','bookedT','sf','maxT','baleM3','tolPct','tiers','L','B','H','ttT','deckT'];
  if(numF.includes(f)){v=parseFloat(v);if(!isFinite(v)||v<0){toast('Enter a number zero or above.','crit');render();return}}
  if(e==='port'){const p=P(id);if(f==='seq')v=Math.max(1,Math.round(v));
    if(f==='role'&&plan.parcels.some(x=>x.lp===id||x.dp===id)){toast(`${p.name} is used by parcels. Change those parcels first.`,'crit');render();return}
    commit(()=>{p[f]=v},`Port ${p.name}: ${f} set to ${v}`)}
  else if(e==='parcel'){const p=PC(id);
    if(f==='id'){v=v.trim();if(!v){render();return}if(v!==id&&PC(v)){toast(`Parcel ID ${v} already exists.`,'crit');render();return}
      commit(()=>{p.id=v;plan.stows.forEach(s=>{if(s.parcel===id)s.parcel=v})},`Parcel ${id} renamed ${v}`);return}
    commit(()=>{p[f]=v},`Parcel ${p.id}: ${f} set to ${v}`)}
  else if(e==='hold'){const h=H(+id),lab={L:'length m',B:'breadth m',H:'height m',baleM3:'bale m³',ttT:'tank top t/m²',deckT:'hatch cover t/m²'}[f]||f;commit(()=>{h[f]=v},`Hold ${h.no}: ${lab} set to ${v}`)}
  else if(e==='ship'){if(f==='tiers'){v=Math.min(8,Math.max(1,Math.round(v)));commit(()=>{plan.ship.tiers=v;plan.stows.forEach(s=>{if(s.tier>v)s.tier=v})},`Tiers per hold set to ${v}`)}else commit(()=>{plan.ship[f]=v},`Ship ${f} set`)}
  else if(e==='voyage')commit(()=>{plan.voyage[f]=v},`Voyage ${f} set`);
}
function addPort(role){
  const used=plan.ports.filter(p=>p.role===role).map(p=>p.color),pal=role==='load'?LP_PAL:DP_PAL;
  const color=pal.find(c=>!used.includes(c))||pal[used.length%pal.length];
  const n=plan.ports.filter(p=>p.role===role).length+1;
  commit(()=>{plan.ports.push({id:uid('p'),name:role==='load'?`Load port ${n}`:`Discharge port ${n}`,code:'',role,seq:n,color})},`Added ${role} port`);
}
function nextPid(){let i=plan.parcels.length+1;while(PC('P'+String(i).padStart(2,'0')))i++;return 'P'+String(i).padStart(2,'0')}
function pasteDialog(){
  modal('Paste cargo list',`<p class="hint" style="margin:0 0 8px">Copy rows from Excel with columns: <b>Grade, Load port, Discharge port, Tonnes, SF</b> (optional 6th: booking ref). Ports are matched by name or code; new ones are created.</p><label for="pastebox">Rows</label><textarea id="pastebox" placeholder="BKP	Santos	Hamburg	6500	1.75"></textarea><p class="err" id="q-err" role="alert"></p>`,
   [{label:'Cancel'},{label:'Add parcels',kind:'primary',run:()=>{
     const lines=$('#pastebox').value.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);const rows=[];
     for(const l of lines){const c=l.split(/\t|;|,(?=\S)/).map(x=>x.trim());const t=parseFloat((c[3]||'').replace(/[^\d.]/g,''));if(!c[1]||!c[2]||!(t>0))continue;rows.push({grade:c[0]||'Cargo',lp:c[1],dp:c[2],t,sf:parseFloat(c[4])||1,ref:c[5]||''})}
     if(!rows.length){$('#q-err').textContent='No usable rows found. Check there are at least 4 columns with tonnes in the 4th.';return false}
     commit(()=>{const find=(name,role)=>{let p=plan.ports.find(x=>x.role===role&&(x.name.toLowerCase()===name.toLowerCase()||x.code.toLowerCase()===name.toLowerCase()));
        if(!p){const used=plan.ports.filter(x=>x.role===role).map(x=>x.color),pal=role==='load'?LP_PAL:DP_PAL;p={id:uid('p'),name,code:'',role,seq:plan.ports.filter(x=>x.role===role).length+1,color:pal.find(c=>!used.includes(c))||pal[0]};plan.ports.push(p)}return p.id};
       rows.forEach(r=>plan.parcels.push({id:nextPid(),ref:r.ref,grade:r.grade,lp:find(r.lp,'load'),dp:find(r.dp,'discharge'),bookedT:r.t,sf:r.sf}))},`Pasted ${rows.length} parcels`);
     toast(`Added ${rows.length} parcels`)}}]);
}

   <label for="jsonbox">Plan JSON</label><textarea id="jsonbox" spellcheck="false">${esc(json)}</textarea>
   <div class="quick"><button class="btn sm" type="button" id="j-copy">Copy</button><button class="btn sm" type="button" id="j-dl">Download file</button><label class="btn sm" for="j-file" style="margin:0;color:var(--fg);font-size:13px">Open file</label><input id="j-file" type="file" accept=".json,application/json" hidden></div>
   <p class="hint">To load a plan, paste its JSON in the box or open a file, then press Load.</p><p class="err" id="q-err" role="alert"></p>`,
   [{label:'Close'},{label:'Load',kind:'primary',run:()=>{
     try{const p=JSON.parse($('#jsonbox').value);if(!p.ship||!Array.isArray(p.ship.holds)||!Array.isArray(p.stows)||!Array.isArray(p.parcels)||!Array.isArray(p.ports))throw 0;
       if(JSON.stringify(p)===JSON.stringify(plan)){return}
       commit(()=>{plan=p;plan.log=plan.log||[];ui.sel=null;ui.focus=null},'Plan loaded from JSON');toast('Plan loaded')}
     catch(e){$('#q-err').textContent='That is not a valid Hold Planner file. Check it starts with { and was saved from this app.';return false}}}]);
  if(IN_ARTIFACT)$('#j-dl').hidden=true;
  $('#j-copy').onclick=()=>copyText(json,'Plan JSON copied');
  $('#j-dl').onclick=()=>{try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([json],{type:'application/json'}));a.download=`hold-plan-${(plan.voyage.name||'voyage').replace(/[^\w]+/g,'-')}.json`;document.body.appendChild(a);a.click();a.remove();toast('Download started. If nothing saved, use Copy instead.')}catch(e){toast('Download is blocked here. Use Copy instead.','warn')}};
  $('#j-file').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{$('#jsonbox').value=r.result;toast('File read. Press Load to open it.')};r.readAsText(f)};
}
function copyText(text,ok){
  const fall=()=>modal('Copy',`<label for="cpbox">Select all and copy</label><textarea id="cpbox">${esc(text)}</textarea>`,[{label:'Close',kind:'primary'}]);
  try{navigator.clipboard.writeText(text).then(()=>toast(ok),fall)}catch(e){fall()}
}

/* ---------- drag and drop ---------- */
let D=null;
function resolveTarget(x,y){
  const el=document.elementFromPoint(x,y);if(!el)return null;
  if(el.closest('#tray'))return {tray:true,el:$('#tray')};
  const auto=el.closest('[data-hold-auto]');if(auto){const n=+auto.dataset.holdAuto;return {hold:n,tier:autoTier(n),auto:true,el:$('#hold-'+n)}}
  const fb=el.closest('.hold-body.free');if(fb){const n=+fb.dataset.freeHold;return {hold:n,tier:1,pt:ptIn(fb,{clientX:x,clientY:y}),el:fb}}
  const st=el.closest('.stow[data-id]');if(st){const s=ST(st.dataset.id);return {hold:s.hold,tier:s.tier,beforeId:s.id,el:st.closest('.layer')}}
  const ly=el.closest('.layer[data-tier]');if(ly)return {hold:+ly.dataset.hold,tier:+ly.dataset.tier,el:ly};
  return null;
}
function clearHi(){$$('.t-ok,.t-warn,.t-block,.t-auto').forEach(e=>e.classList.remove('t-ok','t-warn','t-block','t-auto'))}
function dragQty(){return D.kind==='parcel'?remOf(D.id):ST(D.id).t}
function startDrag(){
  D.on=true;document.body.classList.add('dragging');
  const p=D.kind==='parcel'?PC(D.id):PC(ST(D.id).parcel);
  const g=document.createElement('div');g.className='ghost';g.style.setProperty('--lp',pcol(p.lp));
  g.style.background=`linear-gradient(90deg,${pcol(p.lp)} 0 6px,${pcol(p.dp)} 6px 12px,var(--surface) 12px)`;g.style.paddingLeft='20px';
  g.innerHTML=`<b>${esc(p.id)} ${esc(p.grade)} · ${fmt(dragQty())} t</b><div class="g2">to ${esc(pname(p.dp))}</div><div class="g3"></div>`;
  document.body.appendChild(g);D.g=g;if(D.kind==='stow')D.el.classList.add('src');
}
function moveDrag(e){
  D.g.style.transform=`translate(${e.clientX+14}px,${e.clientY+14}px)`;
  const tg=resolveTarget(e.clientX,e.clientY);clearHi();D.tg=tg;const g3=D.g.querySelector('.g3');
  if(!tg){g3.className='g3';g3.textContent='Drop on a hold tier';return}
  if(tg.tray){if(D.kind==='stow'){tg.el.classList.add('t-ok');g3.className='g3 ok';g3.textContent='Drop to unstow'}else{g3.className='g3';g3.textContent='Already unstowed'}return}
  if(D.kind==='stow'&&tg.beforeId===D.id){g3.className='g3';g3.textContent='Same place';return}
  const r=canDrop({kind:D.kind,id:D.id,hold:tg.hold,tier:tg.tier,t:dragQty(),pt:tg.pt});
  if(tg.auto)tg.el.classList.add('t-auto');
  const lay=tg.auto?(isFree()?$(`.hold-body.free[data-free-hold="${tg.hold}"]`):$(`.layer[data-hold="${tg.hold}"][data-tier="${tg.tier}"]`)):tg.el;lay&&lay.classList.add('t-'+r.level);
  const h=H(tg.hold);g3.className='g3 '+r.level;
  g3.innerHTML=`H${tg.hold}${isFree()?'':' T'+tg.tier} · <span class="num">${fmt(r.before)} → ${fmt(r.after)} t (${pct(r.after,hMax(h)).toFixed(0)}% of TT limit)</span><br>${esc(r.level==='ok'?'No conflicts':r.msg)}`;
}
function endDrag(d,e){
  d.g&&d.g.remove();document.body.classList.remove('dragging');clearHi();d.el.classList.remove('src');
  doDrop(d.kind,d.id,d.tg,e.shiftKey||e.altKey);
}
function doDrop(kind,id,tg,partKey){
  const d={kind,id};if(!tg)return;
  if(tg.tray){if(d.kind==='stow')unstow(d.id);return}
  if(d.kind==='stow'&&tg.beforeId===d.id)return;
  const mv={kind:d.kind,id:d.id,hold:tg.hold,tier:tg.tier,beforeId:tg.beforeId,pt:tg.pt};
  const h=H(tg.hold),room=r3(hMax(h)-hT(tg.hold)+(d.kind==='stow'&&ST(d.id).hold===tg.hold?ST(d.id).t:0));
  if(d.kind==='parcel'){
    const rem=remOf(d.id),def=room>0?Math.min(rem,room):rem;
    qty({title:`Stow ${d.id} in Hold ${tg.hold}${isFree()?'':', Tier '+tg.tier}`,def,max:rem,info:`${fmt(rem)} t remaining for this parcel. Hold ${tg.hold} has ${fmt(Math.max(0,room))} t of room.`,
      quick:[{l:'All remaining',v:rem},...(room>0&&room<rem?[{l:'Fill hold',v:room}]:[]),{l:'Half',v:r3(rem/2)}],ok:'Stow',run:t=>applyMove({...mv,t})});
  }else{
    const s=ST(d.id);
    if(ui.part||partKey){qty({title:`Move part of ${s.parcel} to Hold ${tg.hold}, Tier ${tg.tier}`,def:s.t,max:s.t,info:`Block holds ${fmt(s.t)} t. The rest stays in H${s.hold} T${s.tier}.`,quick:[{l:'Half',v:r3(s.t/2)},...(room>0&&room<s.t?[{l:'Fill hold',v:room}]:[])],ok:'Move',run:t=>applyMove({...mv,t})})}
    else applyMove({...mv,t:s.t});
  }
}
document.addEventListener('pointerdown',e=>{
  if(e.button!==0||D)return;const el=e.target.closest('[data-drag]');if(!el)return;
  D={kind:el.dataset.drag,id:el.dataset.id,x0:e.clientX,y0:e.clientY,on:false,el};
  if(e.pointerType!=='mouse')e.preventDefault();
});
window.addEventListener('pointermove',e=>{if(!D)return;if(!D.on){if(Math.hypot(e.clientX-D.x0,e.clientY-D.y0)<8)return;startDrag()}e.preventDefault();lastPt={x:e.clientX,y:e.clientY};startScroll();moveDrag(e)},{passive:false});
window.addEventListener('pointerup',e=>{if(!D)return;const d=D;D=null;stopScroll();
  if(!d.on){
    if(ui.pick&&d.kind==='stow'){const tg=resolveTarget(e.clientX,e.clientY);const k=ui.pick;if(!(k.kind==='stow'&&tg&&tg.beforeId===k.id)){ui.pick=null;doDrop(k.kind,k.id,tg,false);render();return}}
    if(d.kind==='stow'){ui.sel=d.id;render()}
    else if(d.kind==='parcel'){ui.pick=ui.pick&&ui.pick.id===d.id?null:{kind:'parcel',id:d.id};ui.sel=null;render()}
    return}
  endDrag(d,e)});
document.addEventListener('click',e=>{
  if(!ui.pick||e.target.closest('[data-drag],button,#pickbar'))return;
  const hit=e.target.closest('.layer[data-tier],[data-hold-auto],#tray,.hold-body.free');if(!hit)return;
  const tg=resolveTarget(e.clientX,e.clientY);const k=ui.pick;ui.pick=null;
  if(tg&&tg.tray&&k.kind==='parcel'){render();return}
  doDrop(k.kind,k.id,tg,false);render();
});
let scrollTimer=null,lastPt=null;
function startScroll(){if(scrollTimer)return;scrollTimer=setInterval(()=>{if(!lastPt||!D||!D.on)return;const{x,y}=lastPt;
  if(y<70)window.scrollBy(0,-14);else if(y>innerHeight-70)window.scrollBy(0,14);
  const sc=$('#shipscroll'),r=sc.getBoundingClientRect();if(y>r.top&&y<r.bottom){if(x<r.left+48)sc.scrollLeft-=14;else if(x>r.right-48)sc.scrollLeft+=14}
  moveDrag({clientX:x,clientY:y})},30)}
function stopScroll(){clearInterval(scrollTimer);scrollTimer=null;lastPt=null}
window.addEventListener('pointercancel',()=>{stopScroll();if(!D)return;D.g&&D.g.remove();D.el.classList.remove('src');document.body.classList.remove('dragging');clearHi();D=null});

/* ---------- clicks ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('button,[data-focus],.stow.locked,tr.click');if(!t)return;
  if(t.matches('.stow.locked')){ui.sel=t.dataset.id;render();return}
  if(t.dataset.focus!==undefined){ui.focus=t.dataset.focus&&ui.focus!==t.dataset.focus?t.dataset.focus:null;render();return}
  if(t.dataset.tab){ui.tab=t.dataset.tab;render();return}
  if(t.dataset.scale){ui.scale=t.dataset.scale;render();return}
  if(t.dataset.layout){const to=t.dataset.layout;if((to==='free')===isFree())return;
    commit(()=>{if(to==='free'){stackToShapes();plan.layout='free'}else{shapesToStack();plan.layout='stack';ui.draw=false}},to==='free'?'Switched to free draw layout':'Switched to stacked layout');
    toast(to==='free'?'Free draw: drag, resize and reshape blocks anywhere. Draw block sketches a new one.':'Stacked: blocks arranged in tiers from their drawn positions.');return}
  if(t.id==='b-draw'){ui.draw=!ui.draw;if(ui.draw)ui.sel=null;render();if(ui.draw)toast('Drag inside any hold to draw a cargo block.');return}
  if(t.id==='b-snap'){ui.snap=!ui.snap;render();return}
  if(t.dataset.show){const h=$('#hold-'+t.dataset.show);h.scrollIntoView({behavior:'smooth',block:'center',inline:'center'});h.classList.remove('flash');void h.offsetWidth;h.classList.add('flash');return}
  if(t.dataset.clear){const n=+t.dataset.clear;confirmBox(`Clear Hold ${n}?`,`All ${fmt(hT(n))} t in Hold ${n} goes back to the cargo tray. You can undo this.`,'Clear hold',()=>commit(()=>{plan.stows=plan.stows.filter(s=>s.hold!==n||s.locked)},`Cleared Hold ${n}`));return}
  if(t.dataset.addPort){addPort(t.dataset.addPort);return}
  if(t.dataset.delPort){const p=P(t.dataset.delPort);if(plan.parcels.some(x=>x.lp===p.id||x.dp===p.id)){toast(`${p.name} is used by parcels. Reassign or delete them first.`,'crit');return}commit(()=>{plan.ports=plan.ports.filter(x=>x!==p)},`Deleted port ${p.name}`);return}
  if(t.dataset.delParcel){const id=t.dataset.delParcel,s=stowedOf(id);const run=()=>commit(()=>{plan.parcels=plan.parcels.filter(x=>x.id!==id);plan.stows=plan.stows.filter(x=>x.parcel!==id)},`Deleted parcel ${id}`);s>0?confirmBox(`Delete ${id}?`,`${fmt(s)} t of this parcel is stowed and will be removed from the holds.`,'Delete parcel',run):run();return}
  const act=t.dataset.act,s=ui.sel&&ST(ui.sel);
  if(act==='csv'){copyText(lastCSV,'Table copied as CSV. Paste into Excel.');return}
  if(s){
    if(act==='desel'){ui.sel=null;render()}
    if(act==='pts'){ui.pts=!ui.pts;render()}
    if(act==='rect'){const B=bb(s.shape.pts);commit(()=>{s.shape.pts=rectPts(B.x0,B.y0,B.x1,B.y1)},null)}
    if(act==='fit'){const B=bb(s.shape.pts),vf=s.t*PC(s.parcel).sf/(H(s.hold).baleM3||1),nh=Math.min(1-B.y0,Math.max(0.02,vf/(B.w||1)));commit(()=>{s.shape.pts=s.shape.pts.map(([x,y])=>[x,r4(B.y0+(B.h?(y-B.y0)/B.h:0)*nh)])},null)}
    if(act==='totons'){const p=PC(s.parcel),est=r3(polyArea(s.shape.pts)*H(s.hold).baleM3/(p.sf||1)),maxT=r3(s.t+remOf(p.id));qty({title:`Set tonnes for ${p.id} from its shape`,def:Math.min(est,maxT),max:maxT,info:`The shape holds about ${fmt(est)} t at SF ${p.sf}. Up to ${fmt(maxT)} t is available for this parcel.`,ok:'Set tonnes',run:q=>{const r=canDrop({kind:'stow',id:s.id,hold:s.hold,tier:s.tier,t:s.t});commit(()=>{s.t=q},`Set ${p.id} in H${s.hold} to ${fmt(q)} t`);const w=holdIssues(s.hold).find(i=>i.sev==='crit');if(w)toast(w.msg,'crit')}})}
    if(act==='front'||act==='back'){commit(()=>{plan.stows=plan.stows.filter(x=>x!==s);act==='front'?plan.stows.push(s):plan.stows.unshift(s)},null)}
    if(act==='tapmove'){ui.pick={kind:'stow',id:s.id};render()}
    if(act==='unstow')unstow(s.id);
    if(act==='lock')commit(()=>{s.locked=!s.locked},`${s.locked?'Unlocked':'Locked'} ${s.parcel} in H${s.hold} T${s.tier}`);
    if(act==='split')qty({title:`Split ${s.parcel} block`,def:r3(s.t/2),max:r3(s.t-0.001),info:`Enter the tonnes for the new block. It appears beside the original in H${s.hold} T${s.tier}, ready to drag.`,ok:'Split',run:t=>commit(()=>{const f=t/s.t;s.t=r3(s.t-t);const n={...s,id:uid('s'),t,locked:false};if(s.shape){const B=bb(s.shape.pts);if(isRect(s.shape.pts)){const xm=r4(B.x1-B.w*f);s.shape={pts:rectPts(B.x0,B.y0,xm,B.y1)};n.shape={pts:rectPts(xm,B.y0,B.x1,B.y1)}}else n.shape={pts:translated(s.shape.pts.map(p=>[...p]),0.03,0.03)}}plan.stows.push(n);place(n,null);ui.sel=n.id},`Split ${fmt(t)} t off ${desc(s.parcel)} in H${s.hold} T${s.tier}`)});
    if(act==='moveto'||act==='movepart'){const hold=+$('#mv-h').value,tier=isFree()?s.tier:+$('#mv-t').value;if(hold===s.hold&&tier===s.tier)return;
      if(act==='moveto')applyMove({kind:'stow',id:s.id,hold,tier,t:s.t});
      else qty({title:`Move part of ${s.parcel} to Hold ${hold}, Tier ${tier}`,def:r3(s.t/2),max:s.t,ok:'Move',run:q=>applyMove({kind:'stow',id:s.id,hold,tier,t:q})})}
  }
});
$('#v-plan').onclick=()=>{ui.view='plan';render()};
$('#v-setup').onclick=()=>{ui.view='setup';render()};
$('#b-pickcancel').onclick=()=>{ui.pick=null;render()};
$('#b-undo').onclick=undo;$('#b-redo').onclick=redo;$('#b-data').onclick=dataDialog;
document.addEventListener('click',e=>{if(e.target.closest('#b-part')){ui.part=!ui.part;render();toast(ui.part?'Move part is on: each drop asks for tonnes':'Move part is off')}});
const blankRun=()=>confirmBox('Start a blank voyage?','Ports, parcels and stowage are cleared. Hold figures and tiers stay. You can undo this.','Start blank',()=>commit(()=>{plan=blank(plan);ui.sel=null;ui.focus=null;ui.view='setup'},'Blank voyage started'));
$('#b-blank').onclick=blankRun;
document.addEventListener('click',e=>{
  if(e.target.closest('#b-blank2'))blankRun();
  if(e.target.closest('#b-kite'))confirmBox('Reset hold figures?','All 10 holds go back to the MV Kite Arrow capacity plan figures. Cargo stays where it is. You can undo this.','Reset holds',()=>commit(()=>{plan.ship.holds=kiteHolds()},'Hold figures reset to MV Kite Arrow'));
  if(e.target.closest('#b-sample'))confirmBox('Load the sample voyage?','This replaces the current plan with example data. You can undo this.','Load sample',()=>commit(()=>{plan=sample();ui.sel=null;ui.focus=null},'Sample voyage loaded'));
  if(e.target.closest('#b-clearall'))confirmBox('Unstow all cargo?','Every unlocked block goes back to the cargo tray. You can undo this.','Unstow all',()=>commit(()=>{plan.stows=plan.stows.filter(s=>s.locked)},'Unstowed all cargo'));
  if(e.target.closest('#b-addparcel')){const lp=LPs()[0],dp=DPs()[0];commit(()=>{plan.parcels.push({id:nextPid(),ref:'',grade:'Cargo',lp:lp?lp.id:'',dp:dp?dp.id:'',bookedT:1000,sf:1})},'Added parcel')}
  if(e.target.closest('#b-paste'))pasteDialog();
});
document.addEventListener('change',e=>{if(e.target.dataset&&e.target.dataset.e)editField(e.target)});

/* ---------- keyboard ---------- */
document.addEventListener('keydown',e=>{
  if(!$('#modal').hidden){if(e.key==='Escape')closeModal();if(e.key==='Enter'&&modalOk&&e.target.tagName!=='TEXTAREA'){e.preventDefault();modalOk.click()}return}
  const tag=e.target.tagName;if(['INPUT','TEXTAREA','SELECT'].includes(tag))return;
  const mod=e.ctrlKey||e.metaKey;
  if(mod&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?redo():undo();return}
  if(mod&&e.key.toLowerCase()==='y'){e.preventDefault();redo();return}
  if(e.key==='Enter'&&e.target.classList&&e.target.classList.contains('stow')){ui.sel=e.target.dataset.id;render();return}
  const s=ui.sel&&ST(ui.sel);
  if(e.key==='Escape'&&ui.pick){ui.pick=null;render();return}
  if(e.key==='Escape'&&ui.draw){ui.draw=false;render();return}
  if(e.key==='Escape'&&ui.pts){ui.pts=false;render();return}
  if(e.key==='Escape'){if(D){window.dispatchEvent(new Event('pointercancel'));return}ui.sel=null;ui.focus=null;render();return}
  if(!s)return;
  if(isFree()&&s.shape&&e.key.startsWith('Arrow')&&!(e.key==='Delete')){if(s.locked){toast('This block is locked. Unlock it to move.','warn');return}
    const st=e.shiftKey?0.05:0.01,dx=e.key==='ArrowLeft'?-st:e.key==='ArrowRight'?st:0,dy=e.key==='ArrowUp'?st:e.key==='ArrowDown'?-st:0;e.preventDefault();
    commit(()=>{s.shape.pts=translated(s.shape.pts,dx,dy)},null);return}
  const mv={kind:'stow',id:s.id,hold:s.hold,tier:s.tier,t:s.t};
  if(e.key==='Delete'||e.key==='Backspace'){e.preventDefault();unstow(s.id);return}
  if(s.locked&&e.key.startsWith('Arrow')){toast('This block is locked. Unlock it to move.','warn');return}
  if(e.key==='ArrowUp'){mv.tier=Math.min(plan.ship.tiers,s.tier+1)}
  else if(e.key==='ArrowDown'){mv.tier=Math.max(1,s.tier-1)}
  else if(e.key==='ArrowRight'){mv.hold=Math.max(1,s.hold-1)}
  else if(e.key==='ArrowLeft'){mv.hold=Math.min(plan.ship.holds.length,s.hold+1)}
  else return;
  e.preventDefault();if(mv.hold===s.hold&&mv.tier===s.tier)return;
  if(applyMove(mv))setTimeout(()=>{const el=$(`.stow[data-id="${ui.sel}"]`);el&&el.focus()},0);
});

/* ---------- theme & PWA ---------- */
function applyTheme(t){if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);else document.documentElement.removeAttribute('data-theme')}
let theme=null;try{theme=localStorage.getItem(LST)}catch(e){}applyTheme(theme);
$('#b-theme').onclick=()=>{const dark=document.documentElement.getAttribute('data-theme')==='dark'||(!document.documentElement.getAttribute('data-theme')&&matchMedia('(prefers-color-scheme: dark)').matches);theme=dark?'light':'dark';applyTheme(theme);try{localStorage.setItem(LST,theme)}catch(e){}toast(theme==='dark'?'Dark theme':'Light theme')};
if(!IN_ARTIFACT){
  const m=document.createElement('link');m.rel='manifest';m.href='manifest.webmanifest';document.head.appendChild(m);
  if('serviceWorker' in navigator){
    const had=!!navigator.serviceWorker.controller;let reloaded=false;
    navigator.serviceWorker.addEventListener('controllerchange',()=>{if(had&&!reloaded){reloaded=true;location.reload()}});
    navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>r.update()).catch(()=>{});
  }
}

save();render();
